# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
# how toolforge builds and runs the tool. load it once with:
#   toolforge components config create toolforge.yaml
# after that every deploy reads this file again from source_url, so changes
# here go live with the next push to main
config_version: v1beta1
source_url: https://raw.githubusercontent.com/MadMaxWP/gs-steward-stats/main/toolforge.yaml
components:
  # the website, https://gs-steward-stats.toolforge.org
  web:
    component_type: continuous
    build:
      repository: https://github.com/MadMaxWP/gs-steward-stats
      ref: main
    run:
      command: web
      port: 8000
      publish: /
      health_check_http: /healthz
      # one copy, one gunicorn worker with 16 threads (Procfile). it only reads
      # toolsdb, from the read only copy, so its connections stay at 7 at most
      replicas: 1
      cpu: "1"
      memory: 1Gi
      mount: none
  # reads the wikimedia event stream all the time: the live feed, and saving
  # actions to toolsdb as they happen. not public, the website asks it for the
  # feed on http://listener:8000. only ever one copy, it's the only live writer
  listener:
    component_type: continuous
    build:
      reuse_from: web
    run:
      command: listener
      port: 8000
      health_check_http: /healthz
      replicas: 1
      cpu: "0.5"
      memory: 512Mi
      mount: none
  # sync + recent backfill + summary, every 3 hours
  update:
    component_type: scheduled
    build:
      reuse_from: web
    run:
      command: update
      schedule: "0 */3 * * *"
      cpu: "1"
      memory: 1Gi
      # a normal run takes minutes, stop a stuck one before the next starts
      timeout: 9000
      mount: none
      emails: onfailure
